<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AlgoCircle — Master Data Structures & Algorithms</title>
    <meta
      name="description"
      content="AlgoCircle is a structured data structures and algorithms curriculum: learn the concepts, recognise the patterns, visualise the algorithms and prepare for interviews."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <script>
      // Apply the stored appearance before first paint so there is no flash.
      (function () {
        var read = function (key, allowed, fallback) {
          try {
            var raw = localStorage.getItem('algocircle:v1:' + key);
            var value = raw ? JSON.parse(raw) : fallback;
            return allowed.indexOf(value) === -1 ? fallback : value;
          } catch (e) {
            return fallback;
          }
        };

        var mode = read('theme', ['system', 'light', 'paper', 'dark', 'midnight', 'forest', 'contrast'], 'system');
        var dark = ['dark', 'midnight', 'forest', 'contrast'];

        if (mode === 'system') {
          try {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            mode = 'light';
          }
        }

        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        root.setAttribute('data-font', read('font', ['sans', 'serif', 'rounded', 'script', 'marker', 'mono'], 'sans'));
        root.setAttribute('data-size', read('size', ['small', 'normal', 'large'], 'normal'));
        root.style.colorScheme = dark.indexOf(mode) === -1 ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      AlgoCircle needs JavaScript for its interactive lessons and visualisations. The curriculum
      outline is available in the project README.
    </noscript>
  </body>
</html>
