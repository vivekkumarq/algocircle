<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AlgoCircle — Master Data Structures & Algorithms</title>
    <meta
      name="description"
      content="AlgoCircle is a structured data structures and algorithms curriculum: learn the concepts, recognise the patterns, visualise the algorithms and prepare for interviews."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem('algocircle:v1:theme');
          var mode = stored ? JSON.parse(stored) : 'system';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      AlgoCircle needs JavaScript for its interactive lessons and visualisations. The curriculum
      outline is available in the project README.
    </noscript>
  </body>
</html>
