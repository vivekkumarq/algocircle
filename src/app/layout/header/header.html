<div class="bar">
  <a class="brand" routerLink="/" aria-label="AlgoCircle home">
    <app-logo [size]="30" />
    <span class="brand__text">
      <strong>Algo</strong><span class="brand__accent">Circle</span>
    </span>
  </a>

  <nav class="primary" aria-label="Primary">
    <a routerLink="/learn" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">DSA Topics</a>
    <a routerLink="/algorithms" routerLinkActive="is-active">Algorithms</a>
    <a routerLink="/learn/why-dsa" routerLinkActive="is-active">Why DSA</a>
  </nav>

  <div class="actions">
    <app-appearance-menu />

    <a
      class="icon-btn hide-sm"
      href="https://github.com/vivekkumarq/algocircle"
      target="_blank"
      rel="noopener"
      aria-label="Project repository on GitHub"
    >
      <app-icon name="github" [size]="17" />
    </a>

    <button
      type="button"
      class="icon-btn menu"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="18" />
    </button>
  </div>
</div>
