<div class="bar">
  <a class="brand" routerLink="/" aria-label="AlgoCircle home">
    <app-logo [size]="30" />
    <span class="brand__text">
      <strong>Algo</strong><span class="brand__accent">Circle</span>
    </span>
  </a>

  <nav class="primary" aria-label="Primary">
    <a routerLink="/learn" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">DSA Topics</a>
    <a routerLink="/roadmap" routerLinkActive="is-active">Roadmap</a>
    <a routerLink="/patterns" routerLinkActive="is-active">Patterns</a>
    <a routerLink="/problems" routerLinkActive="is-active">Problems</a>
    <a routerLink="/list/core-75" routerLinkActive="is-active">Practice</a>
    <a class="wide" routerLink="/algorithms" routerLinkActive="is-active">Algorithms</a>
    <a routerLink="/course" routerLinkActive="is-active">Course</a>
    <a class="wide" routerLink="/interview" routerLinkActive="is-active">Interview Q&amp;A</a>
    <a class="wide" routerLink="/guide" routerLinkActive="is-active">How to Learn</a>

    <div class="more" [class.is-open]="moreOpen()">
      <button
        type="button"
        class="more__trigger"
        (click)="toggleMore()"
        [attr.aria-expanded]="moreOpen()"
        aria-haspopup="menu"
        aria-controls="header-more"
      >
        More
        <app-icon name="chevron-down" [size]="14" />
      </button>
      @if (moreOpen()) {
        <div id="header-more" class="more__panel" role="menu" aria-label="More sections">
          <a role="menuitem" routerLink="/algorithms" routerLinkActive="is-active" (click)="closeMore()">Algorithms</a>
          <a role="menuitem" routerLink="/interview" routerLinkActive="is-active" (click)="closeMore()">Interview Q&amp;A</a>
          <a role="menuitem" routerLink="/guide" routerLinkActive="is-active" (click)="closeMore()">How to Learn</a>
        </div>
      }
    </div>
  </nav>

  <div class="actions">
    <button type="button" class="search-trigger" (click)="openSearch()" aria-label="Search (press /)">
      <app-icon name="search" [size]="15" />
      <span class="search-trigger__text">Search</span>
      <span class="kbd">/</span>
    </button>

    <app-appearance-menu />

    <a
      class="icon-btn hide-sm"
      href="https://github.com/vivekkumarq/algocircle"
      target="_blank"
      rel="noopener"
      aria-label="Project repository on GitHub"
    >
      <app-icon name="github" [size]="17" />
    </a>

    <button
      type="button"
      class="icon-btn menu"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="18" />
    </button>
  </div>
</div>
