<div class="bar">
  <a class="brand" routerLink="/" aria-label="AlgoCircle home">
    <app-logo [size]="30" />
    <span class="brand__text">
      <strong>Algo</strong><span class="brand__accent">Circle</span>
    </span>
  </a>

  <nav class="primary" aria-label="Primary">
    @for (link of links; track link.route) {
      <a [routerLink]="link.route" routerLinkActive="is-active">{{ link.label }}</a>
    }
  </nav>

  <div class="actions">
    <a class="search" routerLink="/search" aria-label="Search AlgoCircle">
      <app-icon name="search" [size]="15" />
      <span class="search__text">Search</span>
      <span class="kbd">/</span>
    </a>

    <button type="button" class="icon-btn" (click)="cycleTheme()" [attr.aria-label]="themeLabel()">
      <app-icon [name]="themeIcon()" [size]="17" />
    </button>

    <a
      class="icon-btn hide-sm"
      href="https://github.com/vivekkumarq/algocircle"
      target="_blank"
      rel="noopener"
      aria-label="Project repository on GitHub"
    >
      <app-icon name="github" [size]="17" />
    </a>

    <button
      type="button"
      class="icon-btn menu"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="18" />
    </button>
  </div>
</div>
