<a class="reference" routerLink="/algorithms" routerLinkActive="is-active" (click)="onNavigate()">
  Algorithms reference
</a>

<p class="title">DSA Topics</p>

@for (group of groups; track group.level) {
  <section class="group">
    <h2 class="group__label">{{ group.level }}</h2>
    <ul>
      @for (topic of group.topics; track topic.slug) {
        <li>
          <a
            [routerLink]="['/learn', topic.slug]"
            routerLinkActive="is-active"
            (click)="onNavigate()"
          >
            <span class="num">{{ pad(topic.order) }}</span>
            <span class="label">{{ topic.label }}</span>
          </a>
        </li>
      }
    </ul>
  </section>
}
