@for (section of sections; track section.id) {
  <section class="group">
    <button
      type="button"
      class="group__header"
      [attr.aria-expanded]="!isCollapsed(section.id)"
      [attr.aria-controls]="'nav-' + section.id"
      (click)="toggle(section.id)"
    >
      <app-icon [name]="section.icon" [size]="15" />
      <span class="group__label">{{ section.label }}</span>
      <span class="group__chevron" [class.group__chevron--collapsed]="isCollapsed(section.id)">
        <app-icon name="chevron-down" [size]="14" />
      </span>
    </button>

    <ul class="group__items" [id]="'nav-' + section.id" [hidden]="isCollapsed(section.id)">
      @for (item of section.items; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            [title]="item.hint ?? item.label"
            (click)="onNavigate()"
          >
            <span class="dot" aria-hidden="true"></span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </section>
}
